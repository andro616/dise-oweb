<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Taller repaso</h1>

        <div class="ejercicio">
            <h2>Calculadora</h2>
            <p>calculadora de suma, resta, multiplicación y división</p>

            <div class="input-group">
                <label for="num1">Número 1</label>
                <input type="number" name="num1" id="num1" placeholder="Ingrese el primer número" required value="">
            </div>  

            <div class="input-group">
                <label for="num2">Número 2</label>
                <input type="number" name="num2" id="num2" placeholder="Ingrese el segundo número" required value="">
            </div>       

            <button>Calcular</button>

            <div class="resultado" id="resultado">
                <h3>Resultados:</h3>
                <p id="suma"></p>
                <p id="resta"></p>
                <p id="multiplicacion"></p>
                <p id="division"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
